<!doctype html>

<html lang="vi" data-theme="dark">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<title>Nhóm 4</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Be+Vietnam+Pro:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">

<style>

  @property --ang { syntax: "<angle>"; inherits: false; initial-value: 0deg; }

  :root {

    --bg: #F2F4F8; --surface: #FFFFFF; --ink: #111827; --muted: #566075; --line: #D9DEE8; --accent: #2F46E6;

    --a-bg: #DCE4FF; --a-fg: #1D2FA8;

    --b-bg: #FFE0D6; --b-fg: #A2381A;

    --c-bg: #D3F0E3; --c-fg: #11684A;

    --d-bg: #F1DDF8; --d-fg: #7A2A94;

    --matrix: #00A844; --matrix-head: #006B2B; --matrix-opacity: 0.32;

    --font-display: "Bricolage Grotesque", "Be Vietnam Pro", system-ui, sans-serif;

    --font-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;

    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

  }

  @media (prefers-color-scheme: dark) {

    :root:not([data-theme="light"]) {

      --bg: #0E1118; --surface: #171B25; --ink: #EEF1F7; --muted: #9AA3B8; --line: #2A3040; --accent: #8FA2FF;

      --a-bg: #1E2A66; --a-fg: #C6D1FF;

      --b-bg: #5A2616; --b-fg: #FFD2C2;

      --c-bg: #0F4A36; --c-fg: #BFEBD7;

      --d-bg: #4E1F63; --d-fg: #EBCBF7;

      --matrix: #00FF41; --matrix-head: #E8FFEE; --matrix-opacity: 0.6;

      color-scheme: dark;

    }

  }

  :root[data-theme="dark"] {

    --bg: #0E1118; --surface: #171B25; --ink: #EEF1F7; --muted: #9AA3B8; --line: #2A3040; --accent: #8FA2FF;

    --a-bg: #1E2A66; --a-fg: #C6D1FF;

    --b-bg: #5A2616; --b-fg: #FFD2C2;

    --c-bg: #0F4A36; --c-fg: #BFEBD7;

    --d-bg: #4E1F63; --d-fg: #EBCBF7;

    --matrix: #00FF41; --matrix-head: #E8FFEE; --matrix-opacity: 0.6;

    color-scheme: dark;

  }



  html { scroll-behavior: smooth; overflow-x: clip; }

  body {

    background: var(--bg); color: var(--ink); font-family: var(--font-body);

    font-size: 16px; line-height: 1.65;

    padding-inline: clamp(16px, 4vw, 48px); padding-block: clamp(32px, 6vw, 72px);

  }

  .wrap { position: relative; z-index: 1; max-width: 1120px; margin-inline: auto; display: flex; flex-direction: column; gap: clamp(36px, 6vw, 64px); }



  #matrix { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: var(--matrix-opacity); }



  .hero { display: flex; flex-direction: column; gap: 20px; max-width: 760px; min-width: 0; }

  .eyebrow { font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }

  h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.4rem, 7vw, 4.75rem); line-height: 1.02; letter-spacing: -0.025em; text-wrap: balance; margin: 0; }



  .jump { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }

  .jump-label { font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }

  .chip {

    display: grid; place-items: center; min-width: 48px; height: 48px; padding-inline: 12px; box-sizing: border-box;

    font-family: var(--font-display); font-weight: 800; font-size: 1.4rem;

    text-decoration: none; color: var(--m-fg); background: var(--m-bg);

    border-radius: 4px; transition: transform 0.25s cubic-bezier(.2,.8,.2,1);

  }

  .chip:hover { transform: translateY(-4px) rotate(-3deg); }

  .chip:focus-visible, .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }



  .m-a { --m-bg: var(--a-bg); --m-fg: var(--a-fg); --glow: #4D6DFF; }

  .m-b { --m-bg: var(--b-bg); --m-fg: var(--b-fg); --glow: #FF5A2A; }

  .m-c { --m-bg: var(--c-bg); --m-fg: var(--c-fg); --glow: #12F0A0; }

  .m-d { --m-bg: var(--d-bg); --m-fg: var(--d-fg); --glow: #E04DFF; }

  /* Thẻ E–N: mỗi thẻ một màu riêng theo --h */

  .mx {

    --m-bg: light-dark(hsl(var(--h) 80% 88%), hsl(var(--h) 55% 22%));

    --m-fg: light-dark(hsl(var(--h) 65% 30%), hsl(var(--h) 90% 85%));

    --glow: hsl(var(--h) 100% 58%);

  }



  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(16px, 2.5vw, 28px); }

  .card {

    position: relative; display: flex; flex-direction: column; min-width: 0;

    background: var(--surface); border: 1px solid var(--line); border-radius: 4px;

    scroll-margin-top: 24px;

    transition: transform 0.35s cubic-bezier(.2,.8,.2,1), border-color 0.35s, filter 0.4s, box-shadow 0.4s;

  }

  .card:hover { transform: translateY(-6px); border-color: var(--m-fg); }



  /* Đèn chạy quanh viền khi thẻ đang được giới thiệu (lóe sáng) */

  .card::before {

    content: ""; position: absolute; inset: -4px; border-radius: 8px; padding: 4px;

    background: conic-gradient(from var(--ang), transparent 0 35%, var(--glow) 70%, #fff 96%, transparent 100%);

    filter: drop-shadow(0 0 6px var(--glow)) drop-shadow(0 0 14px var(--glow));

    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);

    -webkit-mask-composite: xor;

    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);

    opacity: 0; pointer-events: none; z-index: 2; transition: opacity 0.3s;

  }

  .card.active::before { opacity: 1; animation: spin 1.4s linear infinite; }

  .card.active { box-shadow: 0 0 36px color-mix(in srgb, var(--glow) 55%, transparent); border-color: var(--glow); }

  @keyframes spin { to { --ang: 360deg; } }



  .badge {

    position: relative; height: 188px; padding: 16px 20px;

    background: var(--m-bg); color: var(--m-fg);

    clip-path: polygon(0 0, calc(100% - 32px) 0, 100% 32px, 100% 100%, 0 100%);

    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; overflow: hidden;

  }

  .badge-role, .badge-since { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; }

  .badge-since { margin-right: 28px; text-align: right; }

  .letter {

    position: absolute; left: 14px; bottom: -0.18em;

    font-family: var(--font-display); font-weight: 800; font-size: 9.5rem; line-height: 1; letter-spacing: -0.04em;

    transition: transform 0.5s cubic-bezier(.2,.9,.2,1.2); pointer-events: none;

  }

  .letter.name { font-size: clamp(4rem, 12vw, 6.5rem); letter-spacing: -0.02em; white-space: nowrap; }

  .card:hover .letter { transform: translateX(10px) scale(1.06) rotate(-2deg); }



  .body { display: flex; flex-direction: column; gap: 14px; padding: 22px 22px 24px; min-width: 0; }

  h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; line-height: 1.15; letter-spacing: -0.01em; margin: 0; }

  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }

  .tags li {

    font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.04em;

    padding: 4px 10px; border: 1px solid var(--line); border-radius: 4px; color: var(--ink);

  }

  .tags li:first-child { background: var(--m-bg); color: var(--m-fg); border-color: transparent; }



  @keyframes rise { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: none; } }

  @keyframes pop  { 0% { opacity: 0; transform: scale(0.4) rotate(-12deg); } 70% { opacity: 1; transform: scale(1.12) rotate(2deg); } 100% { opacity: 1; transform: none; } }

  @keyframes tag  { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  @keyframes slide-l { from { opacity: 0; transform: translateX(-110px); } to { opacity: 1; transform: none; } }

  @keyframes slide-r { from { opacity: 0; transform: translateX(110px); } to { opacity: 1; transform: none; } }



  .rise { animation: rise 0.85s cubic-bezier(.2,.7,.2,1) backwards; animation-delay: calc(var(--intro) + var(--i, 0) * 110ms); }

  .chip { animation: pop 0.7s cubic-bezier(.3,.9,.3,1) backwards; animation-delay: calc(var(--intro) + 450ms + var(--i, 0) * 60ms); }

  .card { animation: slide-l 0.95s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: calc(var(--intro) + 300ms + min(var(--i, 0), 3) * 120ms); }

  .card:nth-child(even) { animation-name: slide-r; }

  .tags li { animation: tag 0.6s ease both; animation-delay: calc(var(--intro) + 700ms + min(var(--i, 0), 3) * 120ms + var(--j, 0) * 70ms); }



  /* Đợi 1,5s rồi máy bay mới đẩy đi (trước là 0,5s) */

  :root { --intro: 2.1s; }

  @keyframes sweep {

    0% { transform: translateX(0); visibility: visible; }

    99% { visibility: visible; }

    100% { transform: translateX(calc(100% + 240px)); visibility: hidden; }

  }

  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-9px) rotate(-1deg); } }

  .intro {

    position: fixed; inset: 0; width: 100%; height: 100%; min-height: 100dvh; padding-bottom: max(0px, calc(100vh - var(--vh, 100vh))); box-sizing: border-box; z-index: 100;

    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;

    background: var(--ink); color: var(--bg); visibility: hidden;

    border-left: 3px solid var(--accent);

    animation: sweep 2.4s cubic-bezier(.62, 0, .28, 1) 1.5s both;

  }

  .intro-name {

    font-family: var(--font-display); font-weight: 800; line-height: 1.05; text-align: center;

    font-size: clamp(2.6rem, 11vw, 6.5rem); letter-spacing: -0.03em; padding-inline: 16px;

  }

  .intro-name .ch[class*="m-"] { color: var(--m-bg); }

  .intro-sub { font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.75; }

  .plane { position: absolute; top: calc(var(--vh, 100vh) / 2); right: calc(100% - 28px); width: clamp(110px, 34vw, 190px); transform: translateY(-50%); pointer-events: none; }

  .plane svg { display: block; width: 100%; height: auto; overflow: visible; animation: bob 1.1s ease-in-out infinite; }

  .plane-trail { position: absolute; right: 86%; top: 43%; width: 45vw; height: 3px; background: linear-gradient(to left, var(--accent), transparent); }



  @supports (animation-timeline: view()) {

    .card { animation: slide-l linear backwards; animation-timeline: view(); animation-range: entry 0% entry 60%; animation-delay: 0s; }

    .tags li { animation: none; }

  }



  html.tour .card:not(.active) { filter: blur(8px) brightness(0.35) saturate(0.4); pointer-events: none; }

  html.tour .wrap { padding-bottom: 70svh; }



  @media (max-width: 760px) {

    .grid { grid-template-columns: minmax(0, 1fr); }

    .badge { height: 168px; }

    .letter { font-size: 8.5rem; }

  }



  /* ===== Hiệu ứng thu nhỏ + Terminal ===== */

  html.zoomed { overflow: hidden; }

  .wrap { will-change: transform, opacity; backface-visibility: hidden; }

  html.zoomed .wrap { visibility: hidden; pointer-events: none; }

  html.zoomout .card, html.zoomout .card::before { transition: none !important; animation: none !important; }

  html.zoomout { scroll-behavior: auto; }



  .term {

    position: fixed; left: 50%; top: calc(var(--vh, 100svh) / 2); z-index: 5;

    width: min(880px, 92vw); height: min(540px, calc(var(--vh, 100svh) * .72)); max-height: 90%;

    display: flex; flex-direction: column; overflow: hidden;

    background: linear-gradient(180deg, rgba(16,20,30,.92), rgba(8,11,16,.94)); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);

    border: 1px solid rgba(143,162,255,.28); border-radius: 14px;

    box-shadow: 0 40px 100px -20px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.04) inset, 0 0 70px -10px rgba(0,255,65,.22), 0 0 120px -30px rgba(143,162,255,.4);

    color: #d7ffe3; font-family: var(--font-mono);

    opacity: 0; visibility: hidden; transform: translate(-50%,-50%) scale(.5); will-change: transform, opacity;

  }

  html.zoomout .term { visibility: visible; animation: term-in 1.1s cubic-bezier(.16,1,.3,1) .1s forwards; }

  @keyframes term-in {

    from { opacity: 0; transform: translate(-50%,-50%) scale(.5); }

    35%  { opacity: 1; }

    to   { opacity: 1; transform: translate(-50%,-50%) scale(1); }

  }

  .term-bar { display: flex; align-items: center; gap: 8px; padding: 11px 16px; background: rgba(255,255,255,.04); border-bottom: 1px solid rgba(255,255,255,.07); }

  .term-tab { margin-left: 14px; padding: 4px 12px; font-size: .72rem; color: #cfe3ff; background: rgba(143,162,255,.14); border: 1px solid rgba(143,162,255,.25); border-radius: 6px 6px 0 0; }

  .term-status { display: flex; justify-content: space-between; gap: 12px; padding: 7px 16px; font-size: .68rem; letter-spacing: .06em; color: #8fa39a; background: rgba(255,255,255,.03); border-top: 1px solid rgba(255,255,255,.07); }

  .term-status b { color: #00ff41; font-weight: 500; }

  .term::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: 14px; background: repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px); }

  .term-bar i { width: 12px; height: 12px; border-radius: 50%; display: block; }

  .term-bar i:nth-child(1) { background: #ff5f57; }

  .term-bar i:nth-child(2) { background: #febc2e; }

  .term-bar i:nth-child(3) { background: #28c840; }

  .term-title { flex: 1; text-align: right; font-size: .72rem; color: #6f8279; }

  .term-body { flex: 1; overflow-y: auto; padding: 16px 18px; font-size: .85rem; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }

  .term-body .ln { display: block; }

  .term-body .ok { color: #00ff41; }

  .term-body .err { color: #ff5f57; }

  .term-body .dim { color: #7d8f86; }

  .term-body .cmd::before { content: "nhom4@server ~ ❯ "; color: #8fa2ff; }

  .term-body .cmd { color: #eef6ff; }

  .term-body .cmd::first-line { color: inherit; }

  .term-body::-webkit-scrollbar { width: 8px; } .term-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 8px; }

  .cursor { display: inline-block; width: .6em; height: 1.1em; vertical-align: text-bottom; background: #00ff41; animation: blink 1s steps(1) infinite; }

  @keyframes blink { 50% { opacity: 0; } }



  /* ===== fastfetch + nút tiếp tục ===== */

  .term-body { overflow-x: auto; }

  .term-body .ln { animation: lnin .25s ease both; }

  @keyframes lnin { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .term-body .ff { white-space: pre; }

  .term-body .tux { color: #ffd479; }

  .term-body .a { color: #8fa2ff; }

  .term-body .h { color: #ffffff; font-weight: 500; }

  .term-body .sw { letter-spacing: 0; }

  .term-next { position: absolute; right: 16px; bottom: 46px; z-index: 6; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; animation: lnin .4s ease both; }

  .term-next button { font: 700 .82rem var(--font-mono); color: #001a07; background: #39ff14; border: 1px solid #b6ffa8; border-radius: 9px; padding: 10px 18px; cursor: pointer; text-shadow: 0 0 1px rgba(255,255,255,.6); box-shadow: 0 0 8px #39ff14, 0 0 22px rgba(57,255,20,.75), 0 0 48px rgba(57,255,20,.45); animation: neon 1.6s ease-in-out infinite alternate; transition: transform .2s; }

  .term-next button:hover { transform: translateY(-2px) scale(1.04); }

  @keyframes neon { from { box-shadow: 0 0 6px #39ff14, 0 0 16px rgba(57,255,20,.6), 0 0 34px rgba(57,255,20,.3); } to { box-shadow: 0 0 10px #7dff5e, 0 0 30px rgba(57,255,20,.95), 0 0 64px rgba(57,255,20,.6); } }

  #fire { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 200; pointer-events: none; }

  #vidWrap { position: fixed; inset: 0; z-index: 210; background: #000; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity .8s ease; }

  #vidWrap.show { display: flex; } #vidWrap.on { opacity: 1; }

  #vidWrap video { width: 100%; height: 100%; object-fit: contain; background: #000; }

  #vidErr { position: absolute; color: #fff; font: 500 14px var(--font-body); text-align: center; padding: 16px; display: none; }

  #vidErr a { color: #39ff14; }

  .term-next small { font-size: .66rem; color: #8fa39a; }

  .term-next small b { color: #cfe3ff; font-weight: 500; }

  @media (max-width: 760px) { .term-body { font-size: .74rem; } }



  .term-input { position: absolute; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; pointer-events: none; }

  .term-next .row { display: flex; gap: 8px; }

  .term-next button.ghost { background: rgba(255,255,255,.08); color: #cfe3ff; box-shadow: none; animation: none; text-shadow: none; font-weight: 500; border: 1px solid rgba(255,255,255,.2); }

  .term-next button.ghost:hover { background: rgba(255,255,255,.14); box-shadow: none; }



  /* ===== Nút Tự động (góc phải trên) ===== */

  .top-actions { position: fixed; top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right)); z-index: 300;

    display: flex; gap: 8px; align-items: center;

    opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .5s ease, visibility 0s linear .5s; }

  .top-actions.show { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity .5s ease; }

  .auto-btn { font: 700 .7rem var(--font-mono); color: #001a07; background: #39ff14; border: 1px solid #b6ffa8; border-radius: 8px;

    padding: 6px 10px; cursor: pointer; white-space: nowrap; animation: neon 1.6s ease-in-out infinite alternate; }

  html.zoomout #autoBtn { display: none; }

  /* Lúc đốt cháy: tắt hiệu ứng nặng phía sau cho mượt */

  html.burning .term { backdrop-filter: none; -webkit-backdrop-filter: none; will-change: auto; }

  html.burning .term::after { display: none; }

  html.burning .auto-btn { animation: none; box-shadow: 0 0 8px #39ff14, 0 0 18px rgba(57,255,20,.6); }



  /* ===== Màn hình boot Linux (trước terminal) ===== */

  html.booting { overflow: hidden; }

  html.booting #autoBtn { display: none; }

  #boot { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 250; background: #000; color: #c8c8c8; overflow: hidden;

    font-family: var(--font-mono), ui-monospace, Menlo, monospace; font-size: .8rem; line-height: 1.45;

    opacity: 1; transition: opacity .9s ease; cursor: default; }

  #bootIn { position: absolute; top: 0; left: 0; right: 0; height: var(--vh, 100svh); max-height: 100%; display: flex; flex-direction: column;

    overflow: hidden; box-sizing: border-box; padding: 14px 16px 40px; }

  #boot[hidden] { display: none !important; }

  #boot.follow #bootIn { justify-content: flex-end; }

  #boot #bootLog { flex: none; }

  #boot.out { opacity: 0; pointer-events: none; }

  #boot .bl { white-space: pre-wrap; word-break: break-word; }

  #boot .ok { color: #3ddc5f; font-weight: 700; }

  #boot .fail { color: #ff5f57; font-weight: 700; }

  #boot .k { color: #8a8a8a; }

  #boot .w { color: #fff; }

  #boot .cursor { background: #dcdcdc; }

  #boot .grub { white-space: pre; color: #cfcfcf; }

  #boot .grub .sel { background: #cfcfcf; color: #000; }

  #boot .skip { position: fixed; right: 12px; bottom: 10px; font-size: .68rem; color: #6b6b6b; letter-spacing: .04em; pointer-events: none; }

  #boot .logo { white-space: pre; color: #1793d1; line-height: 1.12; font-weight: 700; }

  #boot .splash { text-align: center; color: #e6e6e6; margin-top: 10px; letter-spacing: .08em; }

  @media (max-width: 760px) { #boot { font-size: .62rem; } #bootIn { padding: 10px 10px 36px; } }

</style>

</head>

<body>



<script>

/* Tự thích ứng: chiều cao vùng nhìn thấy (không vượt quá chiều cao màn hình thật) */

(function () {

  function f() {

    var h = Math.min(innerHeight, (screen && screen.height) || innerHeight);

    document.documentElement.style.setProperty('--vh', h + 'px');

  }

  f(); addEventListener('resize', f); addEventListener('orientationchange', f);

})();

</script>

<canvas id="matrix" aria-hidden="true"></canvas>

<div class="top-actions" id="topActions">

  <button id="autoBtn" class="auto-btn" type="button">▶ </button>

  <button id="fsBtn" class="auto-btn" type="button">⛶</button>

  <button id="fsExit" class="auto-btn" type="button" hidden>✕ Thoát toàn màn</button>

</div>

  }

  function onUser() { cancel(); }

  function arm() { ['wheel', 'touchmove'].forEach(function (ev) { addEventListener(ev, onUser, { passive: true }); }); }

  function disarm() { ['wheel', 'touchmove'].forEach(function (ev) { removeEventListener(ev, onUser); }); }

    ctx.globalCompositeOperation = 'lighter';

    parts.forEach(function (p) {

      if (p.type === 0) { ctx.globalAlpha = p.life * .5; var s = p.size * p.life; ctx.drawImage(p.hot ? coreSprite : fireSprite, p.x - s/2, p.y - s/2, s, s); }

      else {

        var col = p.life > .6 ? '255,245,200' : p.life > .3 ? '255,165,45' : '225,70,10';

        ctx.globalAlpha = Math.min(1, p.life * 1.6); ctx.strokeStyle = 'rgb(' + col + ')'; ctx.lineWidth = p.size;

        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * .035, p.y - p.vy * .035); ctx.stroke();

        ctx.fillStyle = 'rgb(255,252,235)'; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * .45, 0, 6.2832); ctx.fill();

      }

    });

    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

  }

  function playVideo() {

    var wrap = document.getElementById('vidWrap'), v = document.getElementById('vid'), err = document.getElementById('vidErr');

    document.documentElement.style.overflow = 'hidden';

    wrap.classList.add('show');

    requestAnimationFrame(function () { wrap.classList.add('on'); });

    v.addEventListener('error', function () { err.style.display = 'block'; });

    var pr = v.play(); if (pr && pr.catch) pr.catch(function () { v.muted = true; v.play().catch(function () {}); });

    setTimeout(function () { cv.hidden = true; }, 900);

  }

  function loop(now) {

    if (finished) return;

    raf = requestAnimationFrame(loop);

    var cw = vw(), ch = vh();

    if (cw !== W || ch !== H) {

      /* Đang xoay màn hình: tạm dừng, đợi kích thước ổn định rồi mới co giãn 1 lần */

      if (cw !== pw || ch !== ph) { pw = cw; ph = ch; stableAt = now; }

      if (now - stableAt < 180) { last = now; return; }

      refit(cw, ch); pw = ph = 0;

    } else { pw = ph = 0; }

    if (!last) last = now;

    var dt = Math.min((now - last) / 1000, 0.05); last = now; t += dt;

    var burning = R <= Rmax;

    if (burning) { R += speed * dt; stepOctave(oct1, dt); stepOctave(oct2, dt); stepOctave(oct3, dt); stepOctave(oct4, dt); computeEdge(); spawn(dt); }

    updateParts(dt);

    render(burning && R <= Rmax);

    if (R > Rmax && parts.length === 0) { finished = true; cancelAnimationFrame(raf); render(false); playVideo(); }

  }

  window.startBurn = function () {

    document.documentElement.classList.add('burning');

    if (window.stopMatrix) window.stopMatrix();

    cv.hidden = false; setup(); last = 0; finished = false; parts.length = 0;

    raf = requestAnimationFrame(loop);

  };

})();

</script>
