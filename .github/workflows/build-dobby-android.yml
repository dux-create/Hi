name: Build Dobby for Android (arm, arm64)

on:
  workflow_dispatch:
    inputs:
      dobby_ref:
        description: Dobby branch, tag or commit
        default: master
  push:
    branches: [main, master]

permissions:
  contents: read

# Phiên bản toolchain giống workflow upstream của Dobby
env:
  CMAKE_VERSION: 3.25.2
  LLVM_VERSION: 15.0.6
  NDK_VERSION: r25b

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a] # arm, arm64

    steps:
      - name: Checkout Dobby
        uses: actions/checkout@v6
        with:
          repository: jmpews/Dobby
          ref: ${{ inputs.dobby_ref || 'master' }}
          path: dobby
          submodules: recursive

      - name: Setup toolchains (cmake, llvm, ndk)
        working-directory: dobby
        run: sh scripts/setup_linux_cross_compile.sh

      # Lỗi upstream (jmpews/Dobby issue #253): file asm arm64 dùng cú pháp Mach-O
      # (@PAGE/@PAGEOFF) nên không build được trên Android. Đổi sang cú pháp ELF.
      - name: Patch arm64 asm for Android (ELF syntax)
        working-directory: dobby
        run: |
          D=source/TrampolineBridge/ClosureTrampolineBridge/arm64
          for f in "$D"/*.asm; do
            sed -i -E 's/([A-Za-z_][A-Za-z0-9_]*)@PAGEOFF/:lo12:\1/g; s/([A-Za-z_][A-Za-z0-9_]*)@PAGE\b/\1/g' "$f"
          done
          grep -n 'adrp\|lo12' "$D"/*.asm || true
          if grep -rn '@PAGE' "$D"; then
            echo "Vẫn còn cú pháp Mach-O trong asm" >&2
            exit 1
          fi

      - name: Build
        working-directory: dobby
        run: |
          python3 scripts/platform_builder.py \
            --platform=android \
            --arch=${{ matrix.abi }} \
            --cmake_dir=$HOME/opt/cmake-$CMAKE_VERSION \
            --llvm_dir=$HOME/opt/llvm-$LLVM_VERSION \
            --android_ndk_dir=$HOME/opt/ndk-$NDK_VERSION

      - name: Collect output
        run: |
          mkdir -p out/include out/lib
          cp dobby/include/dobby.h out/include/
          cp -r dobby/build/android/${{ matrix.abi }} out/lib/
          ls -lR out

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dobby-android-${{ matrix.abi }}
          path: out
          if-no-files-found: error
