name: Build Dobby for Android (arm, arm64)

on:
  workflow_dispatch:
    inputs:
      dobby_ref:
        description: Dobby branch, tag or commit
        default: master
  push:
    branches: [main, master]

permissions:
  contents: read

env:
  API_LEVEL: "21"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a] # arm, arm64
        lib: [shared, static]

    steps:
      - name: Checkout Dobby
        uses: actions/checkout@v6
        with:
          repository: jmpews/Dobby
          ref: ${{ inputs.dobby_ref || 'master' }}
          path: dobby
          submodules: recursive

      - name: Configure (Android NDK toolchain)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "Using NDK: $NDK"
          cmake -S dobby -B build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-$API_LEVEL \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DDOBBY_GENERATE_SHARED=${{ matrix.lib == 'shared' && 'ON' || 'OFF' }} \
            -DDOBBY_DEBUG=OFF
          # Các option khác: -DPlugin.SymbolResolver=ON -DPlugin.Android.BionicLinkerUtil=ON

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Collect output
        run: |
          mkdir -p out/include out/lib/${{ matrix.abi }}
          cp dobby/include/dobby.h out/include/
          find build -type f -name 'libdobby.*' -exec cp -v {} out/lib/${{ matrix.abi }}/ \;
          ls -l out/lib/${{ matrix.abi }}/libdobby.*

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dobby-android-${{ matrix.abi }}-${{ matrix.lib }}
          path: out
          if-no-files-found: error
