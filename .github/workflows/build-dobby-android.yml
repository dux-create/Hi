name: Build Dobby Android

on:
  workflow_dispatch:
    inputs:
      dobby_ref:
        description: "Dobby branch/tag/commit"
        default: "master"
  push:
    tags:
      - "v*"

env:
  ANDROID_API: 21

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: armeabi-v7a
            name: arm
          - abi: arm64-v8a
            name: arm64

    steps:
      - name: Checkout Dobby
        uses: actions/checkout@v4
        with:
          repository: jmpews/Dobby
          ref: ${{ github.event.inputs.dobby_ref || 'master' }}
          submodules: recursive

      - name: Setup NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake

      - name: Patch arm64 asm (Mach-O @PAGE syntax -> ELF GOT syntax)
        run: |
          f=source/TrampolineBridge/ClosureTrampolineBridge/arm64/closure_bridge_arm64.asm
          sed -E -i \
            -e 's|adrp[[:space:]]+x17,[[:space:]]*common_closure_bridge_handler@PAGE$|adrp x17, :got:common_closure_bridge_handler|' \
            -e 's|add[[:space:]]+x17,[[:space:]]*x17,[[:space:]]*common_closure_bridge_handler@PAGEOFF$|ldr x17, [x17, :got_lo12:common_closure_bridge_handler]|' \
            "$f"
          grep -n "common_closure_bridge_handler" "$f"

      - name: Configure
        run: |
          cmake -S . -B build-${{ matrix.name }} -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-${{ env.ANDROID_API }} \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DDOBBY_GENERATE_SHARED=ON \
            -DDOBBY_DEBUG=OFF \
            -DPlugin.SymbolResolver=ON \
            -DPlugin.ImportTableReplace=ON \
            -DPlugin.Android.BionicLinkerUtil=ON \
            -DDOBBY_BUILD_EXAMPLE=OFF \
            -DDOBBY_BUILD_TEST=OFF

      - name: Build
        run: cmake --build build-${{ matrix.name }} --parallel

      - name: Collect output
        run: |
          mkdir -p out/${{ matrix.abi }}
          find build-${{ matrix.name }} \( -name "libdobby.so" -o -name "libdobby.a" \) -exec cp {} out/${{ matrix.abi }}/ \;
          mkdir -p out/include
          cp include/dobby.h out/include/ || true
          ls -lR out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dobby-android-${{ matrix.name }}
          path: out/

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Zip
        run: |
          cd dist
          for d in dobby-android-*; do zip -r "$d.zip" "$d"; done

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
