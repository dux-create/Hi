
name: Build Dobby Static Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-dobby.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.abi }}
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: armeabi-v7a
            api: 21
          - abi: arm64-v8a
            api: 21

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Checkout Dobby
        uses: actions/checkout@v4
        with:
          repository: jmpews/Dobby
          ref: master
          path: Dobby
          fetch-depth: 1

      - name: Install CMake and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Configure Dobby
        shell: bash
        run: |
          cmake -S Dobby -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${{ matrix.abi }}" \
            -DANDROID_PLATFORM=android-${{ matrix.api }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DDOBBY_DEBUG=OFF \
            -DDOBBY_BUILD_EXAMPLE=OFF \
            -DDOBBY_BUILD_TEST=OFF

      - name: Build static library
        run: cmake --build build --target dobby_static --parallel 2

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p "output/${{ matrix.abi }}"
          find build -type f -name 'libdobby.a' -print -quit \
            | grep -q . || {
                echo "libdobby.a not found"
                exit 1
              }

          LIB="$(find build -type f -name 'libdobby.a' -print -quit)"
          cp "$LIB" "output/${{ matrix.abi }}/libdobby.a"

          file "output/${{ matrix.abi }}/libdobby.a"

      - name: Upload static library
        uses: actions/upload-artifact@v4
        with:
          name: dobby-${{ matrix.abi }}
          path: output/${{ matrix.abi }}/libdobby.a
          if-no-files-found: error
          retention-days: 14
