<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chân Trời Sự Kiện</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--hint:#9a9fb2;--ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#fff;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer;background:#fff}
#hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font:400 15px/1.4 var(--ui);letter-spacing:.04em;color:var(--hint);background:none;border:0;padding:16px 24px;cursor:pointer;transition:opacity .5s;animation:breathe 2.8s ease-in-out infinite}
#hint.gone{opacity:0;pointer-events:none;animation:none}
#hint:focus-visible{outline:2px solid var(--hint);outline-offset:2px;border-radius:8px}
@keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){#hint{animation:none}}
</style></head><body>
<canvas id="c" role="img" aria-label="Tờ giấy bị không gian bẻ cong, một hố đen xuất hiện, hút cả tờ giấy vào rồi biến mất"></canvas>
<button id="hint" type="button">Bấm vào bất kỳ đâu</button>

<script id="vs" type="x-shader/x-vertex">
attribute vec2 a;
void main(){gl_Position=vec4(a,0.0,1.0);}
</script>

<script id="fs" type="x-shader/x-fragment">
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 uB;     // tâm hố đen (CSS px, gốc dưới trái)
uniform float uS;    // tỉ lệ canvas / CSS px
uniform float uR;    // bán kính bóng đen hiện tại
uniform float uRb;   // bán kính bóng đen đầy đủ
uniform float uRc;   // bán kính "cửa sổ" không gian
uniform float uTime;
uniform float uBend; // độ bẻ cong không gian 0..1
uniform float uWave; // vị trí sóng hấp dẫn
uniform float uDir;  // +1 hút vào, âm = nhả ra
uniform float uJet;  // cường độ các tia xanh

const float CAM_D=20.0,CAM_EL=0.2,CAM_ROLL=-0.28;

float hash31(vec3 p){p=fract(p*0.3183099+0.1);p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float noise3(vec3 x){
  vec3 i=floor(x),f=fract(x);f=f*f*(3.0-2.0*f);
  float a=mix(mix(hash31(i),hash31(i+vec3(1,0,0)),f.x),mix(hash31(i+vec3(0,1,0)),hash31(i+vec3(1,1,0)),f.x),f.y);
  float b=mix(mix(hash31(i+vec3(0,0,1)),hash31(i+vec3(1,0,1)),f.x),mix(hash31(i+vec3(0,1,1)),hash31(i+vec3(1,1,1)),f.x),f.y);
  return mix(a,b,f.z);
}
float fbm3(vec3 p){float a=0.5,s=0.0;for(int i=0;i<5;i++){s+=a*noise3(p);p=p*2.03+vec3(1.7,9.2,3.1);a*=0.5;}return s;}

vec3 starfield(vec3 d){
  vec3 col=vec3(0.008,0.010,0.024);
  float n1=fbm3(d*2.2+3.0),n2=fbm3(d*3.4-5.0);
  col+=vec3(0.11,0.05,0.17)*pow(n1,3.0)*1.3+vec3(0.02,0.07,0.13)*pow(n2,3.0)*1.2;
  for(int L=0;L<3;L++){
    float fl=float(L);
    vec3 p=d*(38.0+fl*47.0),ip=floor(p),fp=fract(p)-0.5;
    if(hash31(ip+fl*13.7)>0.93){
      vec3 off=vec3(hash31(ip+1.3),hash31(ip+2.7),hash31(ip+4.1))-0.5;
      float b=(1.0-smoothstep(0.0,0.13,length(fp-off*0.7)))*(0.4+0.6*hash31(ip+9.1));
      col+=mix(vec3(0.7,0.8,1.0),vec3(1.0,0.8,0.6),hash31(ip+5.5))*b*(1.7-fl*0.35);
    }
  }
  return col;
}
vec3 heatColor(float t){
  vec3 c=mix(vec3(0.35,0.03,0.0),vec3(1.0,0.32,0.04),smoothstep(0.0,0.35,t));
  c=mix(c,vec3(1.0,0.72,0.28),smoothstep(0.3,0.65,t));
  c=mix(c,vec3(1.0,0.95,0.82),smoothstep(0.6,0.95,t));
  return mix(c,vec3(0.82,0.9,1.0),smoothstep(0.95,1.4,t));
}
vec4 diskAt(vec3 hit,vec3 vel,float t){
  float rr=length(hit.xz),rin=2.3,rout=9.8;
  if(rr<rin||rr>rout)return vec4(0.0);
  float a=atan(hit.z,hit.x)-13.0/(rr*sqrt(rr))*t+0.9*log(rr);
  float n1=fbm3(vec3(rr*3.0,cos(a)*2.3,sin(a)*2.3));
  float n2=noise3(vec3(rr*11.0,cos(a)*6.0,sin(a)*6.0)+vec3(0.0,0.0,t*0.2));
  float n3=noise3(vec3(rr*20.0,cos(a)*10.0,sin(a)*10.0)-vec3(0.0,0.0,t*0.6));
  float dens=smoothstep(rin,rin+0.45,rr)*(1.0-smoothstep(rout-3.5,rout,rr))*(0.2+1.5*n1*(0.4+0.7*n2+0.6*n3));
  float temp=pow(rin/rr,0.8)*1.05;
  vec3 vdir=vec3(-hit.z,0.0,hit.x)/rr;
  float beta=min(0.62,0.72/sqrt(rr));
  float dop=sqrt(1.0-beta*beta)/(1.0-beta*dot(vdir,-normalize(vel)));
  vec3 col=heatColor(temp*dop)*(0.35+1.8*pow(temp,1.6))*clamp(pow(dop,3.0),0.15,5.0);
  return vec4(col,clamp(dens*0.85,0.0,0.96));
}
vec3 spaceColor(vec2 p,float rpx){
  float rr=max(uR,1.0),pxToTan=0.13/rr;
  vec3 cam=vec3(0.0,sin(CAM_EL)*CAM_D,-cos(CAM_EL)*CAM_D);
  vec3 fwd=normalize(-cam),right=normalize(cross(vec3(0,1,0),fwd)),up=cross(fwd,right);
  float cr=cos(CAM_ROLL),sr=sin(CAM_ROLL);
  vec3 plane=p.x*(right*cr+up*sr)+p.y*(up*cr-right*sr);
  vec3 rd=normalize(fwd+plane*pxToTan),col;
  if(rpx>7.5*rr){
    float b=rpx/rr*2.6;
    col=starfield(normalize(rd-normalize(plane)*(2.0/b)));
  }else{
    vec3 pos=cam,vel=rd,acc=vec3(0.0);
    float h2=dot(cross(pos,vel),cross(pos,vel)),trans=1.0;
    bool cap=false;
    for(int i=0;i<300;i++){
      float r2=dot(pos,pos),r=sqrt(r2);
      if(r<1.0){cap=true;break;}
      if(r>45.0&&dot(pos,vel)>0.0)break;
      float dt=clamp(0.06*r,0.025,0.8);
      float rho0=length(pos.xz);
      if(rho0<2.5&&r<34.0)dt=min(dt,0.07+0.1*rho0);
      vel=normalize(vel+(-1.5*h2*pos/(r2*r2*r))*dt);
      vec3 prev=pos;pos+=vel*dt;
      // tia phun thẳng đứng màu xanh, xoắn ốc quay cực nhanh
      float jy=abs(pos.y),rho2=dot(pos.xz,pos.xz);
      if(rho2<9.0&&jy>1.2&&jy<18.0){
        float w2=pow(0.22+0.045*jy,2.0);
        float core=exp(-rho2/(0.12*w2));
        float dn=exp(-rho2/w2)+0.12*exp(-rho2/(9.0*w2));
        float ja=atan(pos.z,pos.x);
        float st=0.55+0.45*sin(ja*2.0+jy*0.9-uTime*26.0);
        float nn=noise3(vec3(cos(ja-uTime*9.0)*1.6,sin(ja-uTime*9.0)*1.6,jy*0.8-uTime*14.0));
        float env=smoothstep(1.2,2.6,jy)*(1.0-smoothstep(9.0,18.0,jy))*exp(-jy/10.0);
        float g=(dn*(0.35+0.65*st)*(0.4+1.2*nn)+core*1.5)*env*dt*5.5;
        acc+=trans*mix(vec3(0.12,0.38,1.0),vec3(0.7,0.9,1.0),clamp(core*1.4,0.0,1.0))*g;
      }
      if(prev.y*pos.y<0.0){
        vec4 d=diskAt(mix(prev,pos,prev.y/(prev.y-pos.y)),vel,uTime);
        acc+=trans*d.rgb*d.a;trans*=1.0-d.a;
      }
    }
    if(!cap)acc+=trans*starfield(normalize(vel));
    col=acc;
  }
  col=1.0-exp(-col*1.25);
  col=pow(col,vec3(0.95));
  col+=vec3(1.0,0.5,0.15)*exp(-rpx/(2.8*rr))*0.2*smoothstep(0.95*rr,1.3*rr,rpx);
  return col;
}

// ---- giấy kẻ ô: cần hoa văn để thấy không gian bị bẻ cong ----
float gl1(float x,float cell,float w){return 1.0-smoothstep(0.0,w,abs(fract(x/cell+0.5)-0.5)*cell);}
vec3 paperPat(vec2 q,float fade){
  float mi=max(gl1(q.x,24.0,1.1),gl1(q.y,24.0,1.1));
  float ma=max(gl1(q.x,96.0,1.5),gl1(q.y,96.0,1.5));
  float n=0.5*noise3(vec3(q*0.35,1.0))+0.5*noise3(vec3(q*1.7,4.0));
  vec3 c=vec3(1.0)-n*0.022;
  c-=vec3(0.06,0.052,0.03)*mi*fade;
  c-=vec3(0.10,0.085,0.05)*ma*fade;
  return c;
}

// ánh xạ ngược: điểm trên màn hình -> điểm trên giấy gốc
vec2 warpP(vec2 p,float Rc){
  float r=length(p)+1e-3;
  float act=smoothstep(0.0,30.0,Rc),span=0.16*Rc+45.0;
  float nr=exp(-max(r-Rc,0.0)/span)*act;
  float sw=2.2*nr*uDir;
  vec2 q=mat2(cos(sw),-sin(sw),sin(sw),cos(sw))*p;
  float rq=length(q)+1e-3;
  q*=max(rq+0.8*span*nr*uDir,0.0)/rq;           // giấy bị kéo giãn và hút về mép
  float E=uBend*2.2*uRb,r2=dot(q,q);
  q*=1.0-E*E/(r2+0.09*E*E+1.0);                 // thấu kính hấp dẫn, vòng Einstein
  float tw=0.5*uBend*exp(-sqrt(r2)/(7.0*uRb));
  q=mat2(cos(tw),-sin(tw),sin(tw),cos(tw))*q;   // xoáy không gian
  float x=r-uWave;
  q+=p/r*sin(x*6.0/uRb)*0.28*uRb*uBend*exp(-x*x/(18.0*uRb*uRb)); // sóng hấp dẫn
  return q;
}

vec3 paperColor(vec2 p,float d,float act,float Rc){
  vec2 q=warpP(p,Rc);
  float comp=max(length(warpP(p+vec2(1,0),Rc)-q),length(warpP(p+vec2(0,1),Rc)-q));
  float fade=clamp(1.7/comp,0.0,1.0);
  vec2 dq=(q-p)*0.045;                           // tán sắc màu
  vec3 c=vec3(paperPat(q+dq+uB,fade).r,paperPat(q+uB,fade).g,paperPat(q-dq+uB,fade).b);
  float r=length(p),E=uBend*2.2*uRb;
  c*=1.0-0.35*uBend*exp(-pow(r/(E*1.3+1.0),2.0));
  c-=vec3(0.30,0.22,0.08)*0.5*exp(-pow((r-E)/(0.08*E+2.0),2.0))*smoothstep(0.02,0.2,uBend);
  float dd=max(d,0.0);
  c*=1.0-0.65*exp(-dd/(0.07*Rc+16.0))*act;       // giấy tối dần gần mép (dịch đỏ)
  c*=mix(vec3(1.0),vec3(1.0,0.78,0.55),0.6*exp(-dd/(0.16*Rc+50.0))*act);
  return clamp(c,0.0,1.0);
}

// các tia xanh dương bắn ra từ tâm, xoay điên cuồng
vec3 jets(vec2 p){
  float r=length(p)/uRb,a=atan(p.y,p.x),t=uTime,J=0.0;
  for(int i=0;i<4;i++){
    float fi=float(i),sg=1.0-2.0*mod(fi,2.0);
    float spin=sg*t*(3.4+2.1*fi)+r*(1.6+fi)*sin(t*0.9+fi*1.7)*2.0;
    float n=5.0+fi*4.0;
    float s=abs(sin((a+spin)*n*0.5));
    float beam=pow(1.0-s,16.0+fi*14.0);
    float pulse=0.55+0.45*sin(r*7.0-t*(16.0+fi*4.0)+fi*2.0);
    J+=beam*pulse*(1.0-0.15*fi);
  }
  float flick=0.8+0.2*sin(t*31.0+a*3.0);
  J*=exp(-r*0.38)*smoothstep(0.0,0.12,r)*flick;
  float core=exp(-r*3.2)*(0.8+0.4*sin(t*18.0));
  vec3 blue=mix(vec3(0.15,0.42,1.0),vec3(0.75,0.93,1.0),exp(-r*1.4));
  return blue*(J*2.2+core*1.6);
}

void main(){
  vec2 p=gl_FragCoord.xy/uS-uB;
  float rpx=length(p),th=atan(p.y,p.x);
  float act=smoothstep(0.0,30.0,uRc);
  float wob=uRc*(0.02*sin(th*3.0+1.3+uTime*0.4)+0.012*sin(th*7.0-uTime*0.9))
           +uRc*0.05*(noise3(vec3(cos(th)*2.0,sin(th)*2.0,uTime*0.3))-0.5);
  float Rcw=uRc+wob*act;
  float d=uRc<1.0?1e3:rpx-Rcw;
  vec3 col;
  if(d>1.5){
    col=paperColor(p,d,act,Rcw);
  }else{
    float Es=0.3*uBend*uRb;
    vec2 ps=p*(1.0-0.55*Es*Es/(dot(p,p)+Es*Es+1.0));
    vec3 sp=spaceColor(ps,length(ps));
    col=d<-1.5?sp:mix(sp,paperColor(p,d,act,Rcw),smoothstep(-1.5,1.5,d));
  }
  col+=vec3(1.0,0.72,0.42)*exp(-abs(d)/1.6)*act*0.9;                                   // viền sáng ở mép
  col+=vec3(1.0,0.55,0.2)*exp(-max(-d,0.0)/22.0)*(1.0-smoothstep(-1.5,1.5,d))*act*0.1; // quầng bên trong
  if(uJet>0.001)col+=(1.0-exp(-jets(p)*uJet))*(1.0-smoothstep(-1.5,1.5,d));
  gl_FragColor=vec4(col,1.0);
}
</script>

<script>
(function(){
  var cv=document.getElementById('c'),hint=document.getElementById('hint');
  var gl=cv.getContext('webgl',{alpha:false,antialias:false})||cv.getContext('experimental-webgl');
  if(!gl){hint.textContent='Trình duyệt này không hỗ trợ WebGL';return;}
  function compile(t,s){var o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
    if(!gl.getShaderParameter(o,gl.COMPILE_STATUS)){console.error(gl.getShaderInfoLog(o));return null;}return o;}
  var vs=compile(gl.VERTEX_SHADER,document.getElementById('vs').textContent);
  var fs=compile(gl.FRAGMENT_SHADER,document.getElementById('fs').textContent);
  if(!vs||!fs){hint.textContent='Không khởi tạo được hiệu ứng';return;}
  var prog=gl.createProgram();gl.attachShader(prog,vs);gl.attachShader(prog,fs);gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS)){console.error(gl.getProgramInfoLog(prog));hint.textContent='Không khởi tạo được hiệu ứng';return;}
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  var loc=gl.getAttribLocation(prog,'a');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  var U={};['uB','uS','uR','uRb','uRc','uTime','uBend','uWave','uDir','uJet'].forEach(function(n){U[n]=gl.getUniformLocation(prog,n);});

  function clamp(v,a,b){return v<a?a:v>b?b:v;}
  function ss(a,b,x){var t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);}
  function easeOut(t){return 1-Math.pow(1-t,3);}
  function eio(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}

  var W,H,S,Rb,Bx,By,maxR,state='idle',t0=0,dirty=true,END=12.4;
  function layout(){
    W=innerWidth;H=innerHeight;
    S=Math.min(devicePixelRatio||1,2);S=Math.min(S,Math.sqrt(3.2e6/(W*H)));
    cv.width=Math.max(2,Math.floor(W*S));cv.height=Math.max(2,Math.floor(H*S));
    gl.viewport(0,0,cv.width,cv.height);
    Rb=clamp(Math.min(W,H)*0.12,36,130);
    Bx=W-Rb*3.7;By=Rb*2.6;maxR=Math.hypot(W,H)*1.25;dirty=true;
  }
  function frame(now){
    requestAnimationFrame(frame);
    if(state==='idle'&&!dirty)return;
    var T=0,hs=0,Rc=0,bend=0,wave=0,dir=1,jet=0;
    if(state==='running'){
      T=(now-t0)/1000;
      // 1) không gian bẻ cong trước, 2) hố đen mở ra, 3) hút giấy, 4) bẻ cong lần nữa rồi khép lại
      bend=Math.max(ss(0,1.5,T)*(1-ss(1.8,4.2,T)),ss(8.6,10.4,T)*(1-ss(10.6,12.2,T)));
      wave=T<6?maxR*(0.05+0.95*ss(0,3.8,T)):maxR*(1-ss(8.6,11.2,T));
      hs=ss(0.9,2.6,T)*(1-ss(9.8,11.2,T));
      var openR=Rb*4.4*easeOut(clamp((T-1.2)/1.6,0,1));
      var sweep=(maxR-openR)*Math.pow(clamp((T-2.6)/4.4,0,1),1.7);
      Rc=(openR+sweep)*(1-eio(clamp((T-8.4)/3.0,0,1)));
      if(Rc<1)Rc=0;
      dir=1-1.5*ss(8.4,9.4,T);
      jet=ss(1.8,3.0,T)*(1-ss(9.4,10.6,T));
      if(T>=END){state='idle';hint.classList.remove('gone');dirty=true;Rc=0;hs=0;bend=0;wave=0;dir=1;}
    }
    gl.uniform2f(U.uB,Bx,By);gl.uniform1f(U.uS,S);
    gl.uniform1f(U.uR,Math.max(Rb*hs,1));gl.uniform1f(U.uRb,Rb);gl.uniform1f(U.uRc,Rc);
    gl.uniform1f(U.uTime,now/1000);gl.uniform1f(U.uBend,bend);gl.uniform1f(U.uWave,wave);gl.uniform1f(U.uDir,dir);gl.uniform1f(U.uJet,jet);
    gl.drawArrays(gl.TRIANGLES,0,3);
    if(state==='idle')dirty=false;
  }
  function start(){if(state!=='idle')return;state='running';t0=performance.now();hint.classList.add('gone');}
  cv.addEventListener('click',start);hint.addEventListener('click',start);
  addEventListener('resize',layout);
  layout();requestAnimationFrame(frame);
})();
</script>
</body></html>
